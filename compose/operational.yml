
services:
  hmc-operational-reports-runner:
    image: "${HMC_OPERATIONAL_REPORTS_USE_LOCAL-hmctsprod.azurecr.io/}hmc/operational-reports-runner:${HMC_OPERATIONAL_REPORTS_TAG:-latest}"
    container_name: operational-reports-runner
    environment:
      SERVER_PORT: 4459
      APPINSIGHTS_INSTRUMENTATIONKEY: "${APPINSIGHTS_INSTRUMENTATIONKEY:?APPINSIGHTS_INSTRUMENTATIONKEY must be set}"
      NOTIFY_HMC_API_KEY: "${NOTIFY_HMC_API_KEY:?NOTIFY_HMC_API_KEY must be set}"
      NOTIFY_ERROR_TEMPLATE_ID: "${NOTIFY_ERROR_TEMPLATE_ID:?NOTIFY_ERROR_TEMPLATE_ID must be set}"
      NOTIFY_ERROR_EMAIL_ADDRESS: "${NOTIFY_ERROR_EMAIL_ADDRESS:?NOTIFY_ERROR_EMAIL_ADDRESS must be set}"
      NOTIFY_ERROR_REPLY_TO_EMAIL_ADDRESS: "${NOTIFY_ERROR_REPLY_TO_EMAIL_ADDRESS:?NOTIFY_ERROR_REPLY_TO_EMAIL_ADDRESS must be set}"
      NOTIFY_AWAITING_ACTUALS_TEMPLATE_ID: "${NOTIFY_AWAITING_ACTUALS_TEMPLATE_ID:?NOTIFY_AWAITING_ACTUALS_TEMPLATE_ID must be set}"
      NOTIFY_AWAITING_ACTUALS_EMAIL_ADDRESS: "${NOTIFY_AWAITING_ACTUALS_EMAIL_ADDRESS:?NOTIFY_AWAITING_ACTUALS_EMAIL_ADDRESS must be set}"
      NOTIFY_AWAITING_ACTUALS_REPLY_TO_EMAIL_ADDRESS: "${NOTIFY_AWAITING_ACTUALS_REPLY_TO_EMAIL_ADDRESS:?NOTIFY_AWAITING_ACTUALS_REPLY_TO_EMAIL_ADDRESS must be set}"
      CFT_HEARING_SERVICE_DB_USERNAME: hmc
      CFT_HEARING_SERVICE_DB_PASSWORD: "${HMC_DB_PASSWORD:?HMC_DB_PASSWORD must be set}"
      CFT_HEARING_SERVICE_DB_HOST: "ccd-shared-database"
      CFT_HEARING_SERVICE_DB_PORT: 5432
      CFT_HEARING_SERVICE_DB_NAME:  hmc_cft_hearing_service
      # these environment variables are used by java-logging library
      ROOT_APPENDER:
      JSON_CONSOLE_PRETTY_PRINT:
      ROOT_LOGGING_LEVEL:
      REFORM_SERVICE_TYPE:
      REFORM_SERVICE_NAME:
      REFORM_TEAM:
      REFORM_ENVIRONMENT:
      LOGBACK_DATE_FORMAT:
      LOGBACK_REQUIRE_THREAD:
      LOGBACK_REQUIRE_ALERT_LEVEL: false
      LOGBACK_REQUIRE_ERROR_CODE: false
    ports:
      - 4459:4459
    networks:
      - ccd-network
