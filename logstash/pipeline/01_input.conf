input {
    jdbc {
        jdbc_connection_string => "${DATA_STORE_URL}"
        jdbc_user => "${DATA_STORE_USER}"
        jdbc_password => "${DATA_STORE_PASS}"
        jdbc_validate_connection => true
        jdbc_driver_library => "/usr/share/logstash/ccd/postgresql.jar"
        jdbc_driver_class => "org.postgresql.Driver"
        jdbc_default_timezone => "UTC"
        parameters => {
            "claim_timeout" => "${LOGSTASH_QUEUE_CLAIM_TIMEOUT}"
        }
        statement => "WITH candidates AS (
      SELECT q.id
      FROM case_data_logstash_queue q
      JOIN case_data cd ON q.case_data_id = cd.id
      WHERE q.claimed_at IS NULL
         OR q.claimed_at < clock_timestamp() - CAST(:claim_timeout AS interval)
      ORDER BY q.id
      FOR UPDATE SKIP LOCKED
      LIMIT 100
  ), claimed AS (
      UPDATE case_data_logstash_queue q
      SET claim_token = md5(random()::text || clock_timestamp()::text),
          claimed_at = clock_timestamp()
      FROM candidates c
      WHERE q.id = c.id
      RETURNING q.id AS logstash_queue_id,
                q.case_data_id,
                q.claim_token
  )
  SELECT claimed.logstash_queue_id,
         claimed.claim_token,
         cd.id,
         created_date,
         last_modified,
         jurisdiction,
         case_type_id,
         state,
         last_state_modified_date,
         data::TEXT AS json_data,
         data_classification::TEXT AS json_data_classification,
         reference,
         security_classification,
         supplementary_data::TEXT AS json_supplementary_data,
         version
  FROM claimed
  JOIN case_data cd ON claimed.case_data_id = cd.id"
        clean_run => false
        schedule => "* * * * * *"
    }
}
