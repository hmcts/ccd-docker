name: Logstash queue contract

on:
  pull_request:
    paths:
      - 'logstash/pipeline/01_input.conf'
      - 'tests/logstash-queue-contract.sh'
      - '.github/workflows/logstash-queue-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/logstash-queue-contract.sh
